name: CrateCinema
version: '${version}'
main: io.github.ryukadev.cratecinema.CrateCinemaPlugin
description: In-world opening animations for ExcellentCrates.
authors: [Ryuka]
website: https://github.com/ryuka-dev/CrateCinema
api-version: '1.21'
depend: [nightcore, ExcellentCrates]
softdepend: [floodgate]

commands:
  cratecinema:
    description: Preview shows and reload the configuration.
    usage: /cratecinema preview <show> [tier] | /cratecinema reload
    permission: cratecinema.admin

permissions:
  cratecinema.admin:
    description: Use /cratecinema.
    default: op
