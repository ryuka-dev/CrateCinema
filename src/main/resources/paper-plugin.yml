name: CrateCinema
version: '${version}'
main: io.github.ryukadev.cratecinema.CrateCinemaPlugin
description: In-world opening animations for ExcellentCrates.
authors: [Ryuka]
website: https://github.com/ryuka-dev/CrateCinema
api-version: '1.21'

# ExcellentCrates fires its bootstrap events while it is being enabled; we have to be enabled
# (and listening) before that, so it loads after us.
dependencies:
  server:
    nightcore:
      load: BEFORE
      required: true
      join-classpath: true
    ExcellentCrates:
      load: AFTER
      required: true
      join-classpath: true
    floodgate:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  cratecinema.admin:
    description: Use /cratecinema.
    default: op
