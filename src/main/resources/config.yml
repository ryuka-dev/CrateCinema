# Writes show start/end and interruptions to the console. Logging only; it does not change how shows behave.
debug: false

# Bedrock players (detected through Floodgate) always get the text-only simple show: their clients
# cannot show the item and block displays the other shows are made of.

# Show tier for each ExcellentCrates rarity id, from 0 (plainest) to 3 (grandest).
# Higher tiers build up longer and end with bigger effects. Each show's animation profile (in
# ExcellentCrates' objects/animations/cratecinema_<show>/) sets what the tiers mean for that show.
tiers:
  common: 0
  uncommon: 0
  rare: 1
  epic: 2
  legendary: 3
# Tier for rewards without a rarity, or with a rarity not listed above.
default-tier: 0

# Who sees a show:
#   viewer - only the player opening the crate. Several players can open the same crate at once
#            without their shows overlapping.
#   nearby - also every player within nearby-radius blocks of the crate when the show starts.
audience: viewer
nearby-radius: 16

effects:
  # Multiplies the volume of every show sound. 0 silences the shows.
  sound-volume: 1.0
  # Multiplies particle counts. 0 turns show particles off.
  particle-density: 1.0

limits:
  # At most this many shows run at once. Further openings get the text-only simple show.
  max-concurrent-shows: 50
  # Safety net: a show still running after this many seconds is ended and its reward granted.
  max-show-seconds: 30

messages:
  # Sent when a player tries to open a crate while still watching a show. '&' colour codes are supported.
  already-watching: "&cYou are still watching a crate opening."
