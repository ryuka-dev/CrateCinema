# Rift: a tear opens above the crate, swallows rewards from the pool, throbs in the reward's rarity
# colour and pushes the reward out towards the player.
#
# Lists have four values, one per tier: [tier 0, tier 1, tier 2, tier 3]. Tiers come from the
# reward's rarity (see "tiers" in config.yml). A single number applies to every tier.
# Times are in ticks; 20 ticks = 1 second.

# The block the tear is made of. NETHER_PORTAL is turned to face the player.
tear-block: NETHER_PORTAL

# The tear's outline colour before it takes the reward's rarity colour.
tear-glow: "#AA3CFF"

# How long the tear throbs before it pushes the reward out (0 - 100).
charge-ticks: [6, 14, 24, 36]

# How long the revealed reward stays before the show ends (10 - 200).
hold-ticks: [25, 35, 45, 55]
